# LLaMA-Factory LoRA SFT config — MiniCPM5-2B (heretic-abliterated) tool-calling
# Train on the OpenBMB agent/tool-calling data to strengthen tool calling while
# staying uncensored (base is already abliterated).
#
# Usage:  llamafactory-cli train train/llamafactory_minicpm5-2b-heretic.yaml
# (LLaMA-Factory installed; dataset_info entry registered from convert_agent_data.py)

### model
model_name_or_path: insraq/MiniCPM5-2B-heretic-abliterated   # BF16 abliterated base
trust_remote_code: true
# (optional, for QLoRA on a 16GB card)
# quantization_bit: 4
# quantization_method: bitsandbytes

### method: LoRA
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 32
lora_alpha: 64
lora_dropout: 0.05
lora_target: ALL            # q/k/v/o + gate/up/down; use modules_to_save below
# modules_to_save: [embed_tokens, lm_head]
enable_lora: true

### template — MiniCPM5 uses ChatML-style + thinking; register `minicpm`/`minicpm5` tool template
# If LLaMA-Factory lacks a `minicpm5` tool template, copy the tokenizer's chat_template.jinja
# into a custom template and set:  template: minicpm5
template: minicpm5          # fallback: qwen if a minicpm5 tool template is not shipped
# enable_thinking: false    # MiniCPM5 thinking toggle (LLaMA-Factory supports enable_thinking)

### dataset (after running convert_agent_data.py + registering in dataset_info.json)
dataset: openbmb_agent_toolcall
# add for diversity: dataset: openbmb_agent_toolcall,hermes_function_calling_v1
# add for mix ratios / full run:
# dataset: openbmb_agent_toolcall,xlam_function_calling_60k
# eval dataset:
# eval_dataset: hermes_function_calling_v1
#  (eval tool-calling accuracy on the Berkeley-Function-Calling-Leaderboard held-out items)
#  via:  https://github.com/gorilla-llm/berkeley-function calling-leaderboard

### data
# tools column is present in the data; LLaMA-Factory auto-injects tool schemas
cutoff_len: 8192
max_samples: 100000         # full openbmb agent set is 100K<n<1M; cap to fit memory
overwrite_cache: true
preprocessing_num_workers: 8

### output
output_dir: output/minicpm5-2b-heretic-lora-agent
logging_steps: 10
save_steps: 500
plot_loss: true
overwrite_output_dir: true

### train
per_device_train_batch_size: 2
gradient_accumulation_steps: 8
gradient_checkpointing: true
learning_rate: 1.0e-4
num_train_epochs: 1.0
lr_scheduler_type: cosine
warmup_ratio: 0.03
weight_decay: 0.0
bf16: true
# fp16: false
# deepspeed: ds_stage3.json   # if OOM on one card
dataloader_num_workers: 4

### merge after training:
# llamafactory-cli export <this yaml>  -> merged model
# then:  optionally re-run heretic ablation on the merged weights to keep refusal ~0
# then:  convert to GGUF Q8_0 and re-quantize to IQ4_XS / Q4_K_S for the app
